name: Setup Secrets

on:
  workflow_dispatch:
    inputs:
      gemini_key:
        description: 'Gemini API Key'
        required: true
        type: string
      github_pat:
        description: 'GitHub PAT token'
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set Gemini API Key
        run: |
          echo "${{ inputs.gemini_key }}" | gh secret set VITE_GEMINI_API_KEY
          echo "✅ VITE_GEMINI_API_KEY secret created"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set GitHub Token
        run: |
          echo "${{ inputs.github_pat }}" | gh secret set VITE_GITHUB_TOKEN
          echo "✅ VITE_GITHUB_TOKEN secret created"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify
        run: gh secret list
        env:
          GH_TOKEN: ${{ github.token }}
