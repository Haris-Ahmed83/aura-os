name: Setup Secrets

on:
  workflow_dispatch:
    inputs:
      gemini_key:
        description: 'Gemini API Key'
        required: true
        type: string
      github_pat:
        description: 'GitHub PAT (repo scope)'
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set Gemini API Key
        run: echo "$GEMINI_KEY" | gh secret set VITE_GEMINI_API_KEY --repo $GITHUB_REPOSITORY
        env:
          GEMINI_KEY: ${{ inputs.gemini_key }}
          GH_TOKEN: ${{ inputs.github_pat }}

      - name: Set GitHub Token
        run: echo "$GH_TOKEN" | gh secret set VITE_GITHUB_TOKEN --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ inputs.github_pat }}

      - name: Verify
        run: gh secret list --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ inputs.github_pat }}
